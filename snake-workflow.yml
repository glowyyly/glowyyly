# 🌸 Pink Cherry-Blossom Snake Workflow 🌸
#
# HOW TO SET THIS UP:
# 1. Create a new PUBLIC repo named exactly the same as your username
#    (e.g. "glowyyly/glowyyly") — this is your special GitHub profile repo.
# 2. Put your README.md (and banner.png) in that repo.
# 3. Inside that repo, create the folder: .github/workflows/
# 4. Save this file there as: .github/workflows/snake.yml
# 5. Push it — go to the "Actions" tab and run it once manually.
# 6. It will auto-create an "output" branch containing pink-snake.svg,
#    which is exactly what the README already links to.

name: Generate Pink Snake Animation

on:
  schedule:
    - cron: "0 */6 * * *"   # runs every 6 hours
  workflow_dispatch: {}
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Generate cherry-blossom pink snake SVG
        uses: Platane/snk@v3
        with:
          github_user_name: glowyyly
          outputs: |
            dist/pink-snake.svg?color_snake=%23D6478A&color_dots=%23F7A8C4,%23F492B4,%23EC6FA0,%23D6478A,%238B3A5A

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
